<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />

  <!-- Primary SEO Metadata -->
  <title>TicketSwap — India's Peer-to-Peer Movie Ticket Resale Platform</title>
  <meta name="description"
    content="Plans changed? Buy or sell unused cinema tickets safely on India's smart resale marketplace. Enjoy secure escrow payments or low-fee instant matching for blockbusters at PVR, Inox, Cinepolis & more." />
  <meta name="keywords"
    content="ticket resale, buy movie tickets, sell movie tickets, ticketswap india, discounted movie tickets, secure ticket resale, bookmyshow exchange, pvr ticket resale, inox ticket resale, cinepolis ticket resale, movie tickets, escrow tickets swap" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="TicketSwap Systems India" />
  <meta name="theme-color" content="#030712" />

  <!-- Open Graph / Facebook Protocol -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="TicketSwap — Secure Movie Ticket Resale Marketplace" />
  <meta property="og:description"
    content="Plans changed? Don't lose money on non-refundable tickets. Sell booking seats instantly below cost price, or grab premium discounted seats to sold-out movies on India's smart peer-to-peer swap board." />
  <meta property="og:url" content="https://ticketswap.in" />
  <meta property="og:site_name" content="TicketSwap India" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1200&q=80" />

  <!-- Twitter Card Protocol -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TicketSwap — India's Peer-to-Peer Movie Ticket Resale Platform" />
  <meta name="twitter:description"
    content="Plans changed? Swap unused booking seats safely below cost price in seconds, or scoop discounted tickets to blockbuster films on India's premier escrow-backed cinema gate marketplace." />
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1200&q=80" />

  <!-- Structured JSON-LD Data for Google Search Bot -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TicketSwap India",
        "url": "https://ticketswap.in",
        "description": "Safe, Peer-to-Peer Resale Escrow and Instant Connections Hub for unused movie tickets in India.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://ticketswap.in/browse?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  <!-- Google Identity Services client library for real Google SSO -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-gray-950">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
